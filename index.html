<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>inventaTISwiss</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="container">
<header><h1>📊 inventaTISwiss</h1><p>Gestión de Personal</p></header>
<section class="importador"><h2>📥 Importar Excel</h2><div class="drop-zone" id="dropZone"><p>📁 Arrastra aquí o <button type="button" id="selectFileBtn">Selecciona</button></p><input type="file" id="excelInput" accept=".xlsx,.xls" style="display:none"></div><div id="importStatus" style="display:none;"><div class="progress-bar"><div id="progressFill"></div></div><p id="statusText"></p></div></section>
<section><h2>➕ Agregar Manual</h2><form id="form-personal"><input name="DNI" placeholder="DNI" required><input name="Código" placeholder="Código" required><input name="Nombre" placeholder="Nombre" required><select name="Foto"><option></option><option>SI</option><option>NO</option></select><input name="Fecha de Ingreso" type="date"><input name="Puesto Real" placeholder="Puesto"><input name="CC Real" placeholder="CC"><input name="Unidad Real" placeholder="Unidad"><input name="Nombre Host" placeholder="Host"><input name="Nueva Tajeta Micros" placeholder="Micros"><button type="submit">Guardar</button></form></section>
<section><h2>📋 Personal <input type="text" id="searchInput" placeholder="🔍 Buscar..." style="width:30%;padding:5px;margin-left:10px"> <button id="clearAllBtn" class="btn-danger" style="margin-left:10px">🗑️</button></h2><table><thead><tr><th>DNI</th><th>Código</th><th>Nombre</th><th>Foto</th><th>F.Ing</th><th>Puesto</th><th>CC</th><th>Unidad</th><th>Host</th><th>Micros</th><th></th></tr></thead><tbody id="tbody"></tbody></table></section>
</div>
<script type="module" src="/src/main.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>
</html>
